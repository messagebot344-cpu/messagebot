name: Message Bot V4 CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: message-bot-v4-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze-test-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate V4 packaged release
        run: |
          python tools/v4_runtime_guard.py
          python tools/validate_v4_release.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org org.godfirst .
      - name: Configure Android 15 compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 35")
          needle = "    buildTypes {"
          block = (
              '    signingConfigs {\n'
              '        getByName("debug") {\n'
              '            enableV1Signing = true\n'
              '            enableV2Signing = true\n'
              '            enableV3Signing = true\n'
              '            enableV4Signing = false\n'
              '        }\n'
              '    }\n\n'
          )
          if block not in text:
              if needle not in text:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              text = text.replace(needle, block + needle, 1)
          path.write_text(text)
          PY
          printf "\\norg.gradle.vfs.watch=false\\n" >> android/gradle.properties
      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | sed \
            -e '/^[0-9][0-9]* packages have newer versions/d' \
            -e '/Try `flutter pub outdated` for more information\./d'
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify Android 15 ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          FINAL_APK="build/app/outputs/flutter-apk/Message_Bot_V4_Android15_ARM64.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -P 16 -c -v 4 "$APK"
          VERIFY_OUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -q "^Verifies"
          echo "$VERIFY_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | tee build/app/outputs/flutter-apk/message-bot-v4-android15-badging.txt
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'"
          rm -rf build/apk-native-check
          mkdir -p build/apk-native-check
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d build/apk-native-check
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          libs = sorted(Path("build/apk-native-check/lib/arm64-v8a").glob("*.so"))
          if not libs:
              raise SystemExit("No ARM64 native libraries found")
          for lib in libs:
              out = subprocess.check_output(["readelf", "-lW", str(lib)], text=True)
              aligns = [int(x, 16) for x in re.findall(r"LOAD.*?\s(0x[0-9a-fA-F]+)\s*$", out, re.M)]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"{lib.name} is not 16 KB ELF-aligned: {aligns}")
              print(f"{lib.name}: 16 KB ELF alignment OK ({aligns})")
          PY
          cp "$APK" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee build/app/outputs/flutter-apk/message-bot-v4-android15-arm64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: message-bot-v4-android15-arm64-apk
          path: |
            build/app/outputs/flutter-apk/Message_Bot_V4_Android15_ARM64.apk
            build/app/outputs/flutter-apk/message-bot-v4-android15-arm64.sha256
            build/app/outputs/flutter-apk/message-bot-v4-android15-badging.txt

  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org org.godfirst .
      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | sed \
            -e '/^[0-9][0-9]* packages have newer versions/d' \
            -e '/Try `flutter pub outdated` for more information\./d'
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: message-bot-v4-windows
          path: build/windows/x64/runner/Release/
