name: Message Bot V4 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V4 packaged release
        run: |
          python tools/v4_runtime_guard.py
          python tools/validate_v4_release.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org org.godfirst .
      - name: Force broadly compatible APK signing schemes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          needle = "    buildTypes {"
          block = (
              '    signingConfigs {\n'
              '        getByName("debug") {\n'
              '            enableV1Signing = true\n'
              '            enableV2Signing = true\n'
              '            enableV3Signing = true\n'
              '            enableV4Signing = true\n'
              '        }\n'
              '    }\n\n'
          )
          if block not in text:
              if needle not in text:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              text = text.replace(needle, block + needle, 1)
              path.write_text(text)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Re-sign and verify Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          RAW_APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          FINAL_APK="build/app/outputs/flutter-apk/Message_Bot_V4_ARM64.apk"
          KEYSTORE="$HOME/.android/messagebot-ci.keystore"
          test -s "$RAW_APK"
          unzip -t "$RAW_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$RAW_APK"
          mkdir -p "$HOME/.android"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias messagebot \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Message Bot, OU=GodFirst, O=GodFirst, L=Brazzaville, C=CG"
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias messagebot \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$FINAL_APK" \
            "$RAW_APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK"
          unzip -t "$FINAL_APK"
          VERIFY_OUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK")
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$VERIFY_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$VERIFY_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          jarsigner -verify "$FINAL_APK"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL_APK" | tee build/app/outputs/flutter-apk/message-bot-v4-arm64-badging.txt
          sha256sum "$FINAL_APK" | tee build/app/outputs/flutter-apk/message-bot-v4-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: message-bot-v4-arm64-apk
          path: |
            build/app/outputs/flutter-apk/Message_Bot_V4_ARM64.apk
            build/app/outputs/flutter-apk/message-bot-v4-arm64.sha256
            build/app/outputs/flutter-apk/message-bot-v4-arm64-badging.txt

  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org org.godfirst .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: message-bot-v4-windows
          path: build/windows/x64/runner/Release/
