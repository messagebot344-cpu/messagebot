name: Message Bot V4 CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: message-bot-v4-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze-test-android-release:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Validate V4 packaged release
        run: |
          python tools/v4_runtime_guard.py
          python tools/validate_v4_release.py
      - name: Test Study Pack pipeline
        run: python -m unittest discover tools/study_pipeline -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org org.godfirst .
      - name: Configure Android 15 compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 35")
          needle = "    buildTypes {"
          block = (
              '    signingConfigs {\n'
              '        getByName("debug") {\n'
              '            enableV1Signing = true\n'
              '            enableV2Signing = true\n'
              '            enableV3Signing = true\n'
              '            enableV4Signing = false\n'
              '        }\n'
              '    }\n\n'
          )
          if block not in text:
              if needle not in text:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              text = text.replace(needle, block + needle, 1)
          path.write_text(text)
          PY
          printf "\\norg.gradle.vfs.watch=false\\n" >> android/gradle.properties
      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | sed \
            -e '/^[0-9][0-9]* packages have newer versions/d' \
            -e '/Try `flutter pub outdated` for more information\./d'
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify Android 15 ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          FINAL_APK="build/app/outputs/flutter-apk/Message_Bot_V4_Android15_ARM64.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -P 16 -c -v 4 "$APK"
          VERIFY_OUT=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -q "^Verifies"
          echo "$VERIFY_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | tee build/app/outputs/flutter-apk/message-bot-v4-android15-badging.txt
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'"
          rm -rf build/apk-native-check
          mkdir -p build/apk-native-check
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d build/apk-native-check
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          libs = sorted(Path("build/apk-native-check/lib/arm64-v8a").glob("*.so"))
          if not libs:
              raise SystemExit("No ARM64 native libraries found")
          for lib in libs:
              out = subprocess.check_output(["readelf", "-lW", str(lib)], text=True)
              aligns = [int(x, 16) for x in re.findall(r"LOAD.*?\s(0x[0-9a-fA-F]+)\s*$", out, re.M)]
              if not aligns or min(aligns) < 0x4000:
                  raise SystemExit(f"{lib.name} is not 16 KB ELF-aligned: {aligns}")
              print(f"{lib.name}: 16 KB ELF alignment OK ({aligns})")
          PY
          cp "$APK" "$FINAL_APK"
          sha256sum "$FINAL_APK" | tee build/app/outputs/flutter-apk/message-bot-v4-android15-arm64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: message-bot-v4-android15-arm64-apk
          path: |
            build/app/outputs/flutter-apk/Message_Bot_V4_Android15_ARM64.apk
            build/app/outputs/flutter-apk/message-bot-v4-android15-arm64.sha256
            build/app/outputs/flutter-apk/message-bot-v4-android15-badging.txt

  windows-release:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org org.godfirst .
      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | sed \
            -e '/^[0-9][0-9]* packages have newer versions/d' \
            -e '/Try `flutter pub outdated` for more information\./d'
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: message-bot-v4-windows
          path: build/windows/x64/runner/Release/
  study-prototype-audit:
    if: github.ref == 'refs/heads/feature/certifying-study-engine' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prototype-audit]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct validated corpus
        run: |
          mkdir -p build/study-audit
          python tools/study_pipeline/reconstruct_corpus.py . build/study-audit/corpus.db
      - name: Select representative prototype sermons
        run: |
          python tools/study_pipeline/select_prototype_sermons.py build/study-audit/corpus.db --report build/study-audit/prototype_candidates.json
          rm -f build/study-audit/corpus.db
      - uses: actions/upload-artifact@v7
        with:
          name: study-prototype-audit
          path: build/study-audit/prototype_candidates.json

  study-prototype-source-export:
    if: github.ref == 'refs/heads/feature/certifying-study-engine' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prototype-source-export]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reconstruct validated corpus
        run: |
          mkdir -p build/study-source-export
          python tools/study_pipeline/reconstruct_corpus.py . build/study-source-export/corpus.db
      - name: Export exact selected prototype sources
        run: |
          python tools/study_pipeline/export_prototype_sources.py build/study-source-export/corpus.db --selection reports/study_prototype_selection.json --output build/study-source-export/prototype_sources.json
          rm -f build/study-source-export/corpus.db
      - uses: actions/upload-artifact@v7
        with:
          name: study-prototype-sources
          path: build/study-source-export/prototype_sources.json


  study-foundation-package:
    if: github.ref == 'refs/heads/feature/certifying-study-engine' && contains(github.event.head_commit.message, '[package-study-foundation]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package Study Pack foundation
        run: python tools/study_pipeline/package_study_foundation.py
      - name: Verify generated Study Pack assets
        run: |
          python - <<'PY'
          import hashlib, json, sqlite3
          from pathlib import Path
          manifest = json.loads(Path("assets/study/manifest.json").read_text(encoding="utf-8"))
          part = Path("assets/study/db_parts") / manifest["parts"][0]["name"]
          assert part.stat().st_size == manifest["database_bytes"]
          assert hashlib.sha256(part.read_bytes()).hexdigest() == manifest["database_sha256"]
          db = sqlite3.connect(f"file:{part}?mode=ro", uri=True)
          try:
              assert db.execute("PRAGMA quick_check").fetchone()[0].lower() == "ok"
              assert db.execute("SELECT value FROM study_pack_meta WHERE key='corpus_version'").fetchone()[0] == manifest["corpus_version"]
              assert db.execute("SELECT value FROM study_pack_meta WHERE key='corpus_canonical_sha256'").fetchone()[0] == manifest["corpus_canonical_sha256"]
          finally:
              db.close()
          print("STUDY_FOUNDATION_PACKAGE: OK")
          PY
      - name: Commit packaged foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/study/manifest.json assets/study/db_parts/study_packs.db.part000
          if git diff --cached --quiet; then
            echo "Study foundation already up to date."
            exit 0
          fi
          git commit -m "build: package Study Pack foundation"
          git push origin HEAD:feature/certifying-study-engine

  study-industrial-package:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[package-study-industrial]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify industrial Study Pack generator
        run: python -m unittest tools.study_pipeline.test_industrial_packset
      - name: Reconstruct validated corpus
        run: |
          mkdir -p build/study-industrial
          python tools/study_pipeline/reconstruct_corpus.py . build/study-industrial/corpus.db
      - name: Build deterministic industrial Study Pack set
        run: |
          python tools/study_pipeline/build_industrial_packset.py \
            build/study-industrial/corpus.db \
            build/study-industrial/study_packs.db \
            --assets-dir assets/study \
            --report reports/study_industrial_report.json
      - name: Validate every published Study Pack against canonical corpus
        run: |
          python tools/study_pipeline/validate_industrial_packset.py \
            build/study-industrial/corpus.db \
            build/study-industrial/study_packs.db \
            --report reports/study_industrial_validation.json
          rm -f build/study-industrial/corpus.db build/study-industrial/study_packs.db
      - name: Commit validated Study Pack set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/study reports/study_industrial_report.json reports/study_industrial_validation.json
          if git diff --cached --quiet; then
            echo "Industrial Study Pack set already up to date."
            exit 0
          fi
          git commit -m "build: package validated industrial Study Packs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

